name: Espelhar no Forgejo

on:
  push:
  delete:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-forgejo
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-latest

    env:
      FORGEJO_SSH_URL: ssh://git@ssh.git.uricer.edu.br:64022/mlucas/tcc-105087-kleidson.git
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Copiar codigo e evidencias ao Forgejo por SSH (sem objetos LFS)
        shell: bash
        env:
          FORGEJO_SSH_PRIVATE_KEY: ${{ secrets.FORGEJO_SSH_PRIVATE_KEY }}
          # SSH bypasses the HTTP Git upload limit. LFS stays separate because
          # its HTTP endpoint also rejected uploads; evidence uses ordinary Git.
          GIT_LFS_SKIP_PUSH: "1"
        run: |
          set -euo pipefail

          if [[ -z "${FORGEJO_SSH_PRIVATE_KEY}" ]]; then
            echo "Configure o secret FORGEJO_SSH_PRIVATE_KEY antes de publicar no Forge."
            exit 1
          fi

          key_file="$(mktemp "${RUNNER_TEMP}/forge-key.XXXXXX")"
          known_hosts_file="$(mktemp "${RUNNER_TEMP}/forge-hosts.XXXXXX")"
          trap 'rm -f "$key_file" "$known_hosts_file"' EXIT
          chmod 600 "$key_file" "$known_hosts_file"
          printf '%s\n' "$FORGEJO_SSH_PRIVATE_KEY" | tr -d '\r' > "$key_file"
          unset FORGEJO_SSH_PRIVATE_KEY

          mkdir mirror.git
          cd mirror.git

          git init --bare

          git remote add github \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git fetch --prune github \
            "+refs/heads/*:refs/heads/*" \
            "+refs/tags/*:refs/tags/*"

          git show main:.github/forge_known_hosts > "$known_hosts_file"
          test -s "$known_hosts_file"
          export GIT_SSH_COMMAND="ssh -i \"$key_file\" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=\"$known_hosts_file\" -o ConnectTimeout=20"

          git remote add forgejo \
            "$FORGEJO_SSH_URL"

          git ls-remote forgejo refs/heads/main

          git push forgejo --prune \
            "+refs/heads/*:refs/heads/*"

          git push forgejo --prune \
            "+refs/tags/*:refs/tags/*"

          echo "::warning::Codigo e evidencias publicados. Objetos LFS nao foram sincronizados: o endpoint do Forge recusou uploads grandes (HTTP 413). Consulte o README para clonar sem baixar LFS e conferir os resultados."
          {
            echo "### Espelhamento de codigo e evidencias"
            echo "Branches e tags foram enviados ao Forge por SSH na porta 64022, incluindo os arquivos Git comuns de evidencias/."
            echo ""
            echo "**Limite:** objetos Git LFS nao foram copiados. Esta execucao nao certifica um espelho LFS completo."
            echo "O catalogo experimental em evidencias/catalogo_20261019/ usa Git comum e permite recalcular as tabelas sem LFS."
          } >> "$GITHUB_STEP_SUMMARY"
