name: Espelhar no Forgejo

on:
  push:
  delete:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-forgejo
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-latest

    env:
      FORGEJO_HOST: www.forge.uricer.edu.br
      FORGEJO_USUARIO: 105087
      FORGEJO_REPOSITORIO: mlucas/tcc-105087-kleidson.git
      FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Copiar codigo e evidencias para o Forgejo (sem objetos LFS)
        shell: bash
        env:
          # The Forge LFS endpoint rejects large uploads (HTTP 413).
          # Evidence files are ordinary Git blobs; do not let the LFS hook
          # block their publication or upload the full historical LFS store.
          GIT_LFS_SKIP_PUSH: "1"
        run: |
          set -euo pipefail

          if [[ -z "${FORGEJO_TOKEN}" ]]; then
            echo "Configure o secret FORGEJO_TOKEN antes de publicar no Forge."
            exit 1
          fi

          mkdir mirror.git
          cd mirror.git

          git init --bare

          git remote add github \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git fetch --prune github \
            "+refs/heads/*:refs/heads/*" \
            "+refs/tags/*:refs/tags/*"

          git remote add forgejo \
            "https://${FORGEJO_USUARIO}:${FORGEJO_TOKEN}@${FORGEJO_HOST}/${FORGEJO_REPOSITORIO}"

          git push forgejo --prune \
            "+refs/heads/*:refs/heads/*"

          git push forgejo --prune \
            "+refs/tags/*:refs/tags/*"

          echo "::warning::Codigo e evidencias publicados. Objetos LFS nao foram sincronizados: o endpoint do Forge recusou uploads grandes (HTTP 413). Consulte o README para clonar sem baixar LFS e conferir os resultados."
          {
            echo "### Espelhamento de codigo e evidencias"
            echo "Branches e tags foram enviados ao Forge, incluindo os arquivos Git comuns de evidencias/."
            echo ""
            echo "**Limite:** objetos Git LFS nao foram copiados. Esta execucao nao certifica um espelho LFS completo."
            echo "O catalogo experimental em evidencias/catalogo_20261019/ usa Git comum e permite recalcular as tabelas sem LFS."
          } >> "$GITHUB_STEP_SUMMARY"
