services:
  docker-comm:
    build: .
    container_name: docker-comm
    env_file:
      - .env
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      AGENT_URL: ${AGENT_URL}
      DEFAULT_BRANCH_ID: ${DEFAULT_BRANCH_ID:-1}
      REVIEW_API_URL: ${REVIEW_API_URL:-http://docker-agent:8001}
      REVIEW_API_KEY: ${REVIEW_API_KEY:-}
      REVIEWED_BY: ${REVIEWED_BY:-}
      HISTORY_LIMIT: ${HISTORY_LIMIT:-6}
      AGENT_TIMEOUT_SECONDS: ${AGENT_TIMEOUT_SECONDS:-20}
      AGENT_RETRY_COUNT: ${AGENT_RETRY_COUNT:-1}
      AGENT_GATEWAY_API_KEY: ${AGENT_GATEWAY_API_KEY:-}
      ENABLE_TEST_ENDPOINT: ${ENABLE_TEST_ENDPOINT:-true}
      API_KEY: ${API_KEY:-}
    ports:
      - "${COMM_BIND_HOST:-127.0.0.1}:${COMM_PORT:-8000}:8000"
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - default
      - tcc-integration

  docker-comm-ui:
    build: .
    container_name: docker-comm-ui
    env_file:
      - .env
    environment:
      COMM_API_URL: ${COMM_API_URL:-http://docker-comm:8000}
      COMM_API_KEY: ${API_KEY:-}
      STREAMLIT_SOURCE: ${STREAMLIT_SOURCE:-webchat}
      DEFAULT_BRANCH_ID: ${DEFAULT_BRANCH_ID:-1}
    command:
      - streamlit
      - run
      - ui/streamlit_app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
      - --browser.gatherUsageStats=false
    ports:
      - "${STREAMLIT_BIND_HOST:-127.0.0.1}:${STREAMLIT_PORT:-8501}:8501"
    depends_on:
      - docker-comm
    restart: unless-stopped
    networks:
      - default
      - tcc-integration

  redis:
    image: redis:7-alpine
    container_name: docker-comm-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped

networks:
  tcc-integration:
    name: tcc-integration
