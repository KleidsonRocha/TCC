[mutmut]
paths_to_mutate =
    app/
    scripts/training/
also_copy =
    scripts/eval/
    scripts/testing/
    docs/assets/datasets/
pytest_add_cli_args_test_selection =
    tests/
mutate_only_covered_lines = true
max_stack_depth = 8
do_not_mutate =
    */__init__.py

[tool:pytest]
addopts = --ignore=mutants
