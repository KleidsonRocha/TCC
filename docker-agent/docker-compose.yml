services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    networks:
      - tcc-integration

  docker-agent:
    build: .
    container_name: docker-agent
    depends_on:
      - ollama
    environment:
      APP_ENV: ${APP_ENV:-dev}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      AGENT_PORT: ${AGENT_PORT:-8001}
      DEFAULT_LOCALE: ${DEFAULT_LOCALE:-pt-BR}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-America/Sao_Paulo}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:7b}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-240000}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.0}
      LLM_NUM_PREDICT: ${LLM_NUM_PREDICT:-220}
      LLM_THINK: ${LLM_THINK:-false}
      LLM_LOG_RAW_RESPONSE: ${LLM_LOG_RAW_RESPONSE:-false}
      LLM_CATEGORIES_FILE: ${LLM_CATEGORIES_FILE:-}
    ports:
      - "8001:8001"
    restart: unless-stopped
    networks:
      - tcc-integration

volumes:
  ollama_data:

networks:
  tcc-integration:
    name: tcc-integration
